<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>JVK202 Mode Select</title>

    <script src="settingsStorage.js"></script>
    <script src="dictionary.js"></script>

    <script>
        (function () {
            const S = window.KVIM_SETTINGS || null;
            const I18N = window.KVIM_I18N_DICT || {};

            let theme = "dark";
            let lang = "zh-TW";

            try {
                if (S) {
                    theme = S.getSharedSetting("theme", "dark");
                    lang = S.getSharedSetting("lang", "zh-TW");
                }
            } catch (e) {
                theme = "dark";
                lang = "zh-TW";
            }

            if (theme !== "light" && theme !== "dark") {
                theme = "dark";
            }

            if (!I18N[lang]) {
                lang = "zh-TW";
            }

            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.setAttribute("lang", lang);

            window.MODE_SELECT_INITIAL_LANG = lang;
            window.MODE_SELECT_INITIAL_THEME = theme;
        })();
    </script>

    <link rel="stylesheet" href="./common.css">

    <style>
        html, body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            overflow: hidden;
        }

        .mode-root {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mode-panel {
            width: 420px;
            padding: 28px;
            border-radius: 20px;
            background: var(--bg-topbar);
            box-shadow:
                -4px -4px 8px var(--title-shadow-hi),
                3px 3px 3px var(--title-shadow-lo);
            text-align: center;
        }

        .mode-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 24px;
        }

        .mode-subtitle {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 28px;
        }

        .mode-button {
            width: 260px;
            height: 42px;
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 999px;
            background: var(--bg-topbar);
            color: var(--text-color);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow:
                -4px -4px 8px var(--title-shadow-hi),
                3px 3px 3px var(--title-shadow-lo);
        }

        .mode-button:hover {
            background: var(--btn-bg-hover);
        }

        .mode-button:active {
            transform: translateY(1px);
        }
    </style>
</head>

<body>
    <div class="mode-root">
        <div class="mode-panel">
            <div class="mode-title">JVK202</div>
            <div class="mode-subtitle" data-i18n="mode.subtitle">請選擇啟動模式</div>

            <button class="mode-button" id="btn-single" data-i18n="mode.single">
                單機版
            </button>

            <button class="mode-button" id="btn-quad" data-i18n="mode.quad">
                Quad 四分割版
            </button>
        </div>
    </div>

    <script>
        function applyModeSelectI18N(lang) {
            const I18N = window.KVIM_I18N_DICT || {};

            if (!I18N[lang]) {
                lang = "zh-TW";
            }

            document.documentElement.setAttribute("lang", lang);

            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                const text = I18N[lang]?.[key];

                if (text === undefined) return;

                const attr = el.getAttribute("data-i18n-attr");
                if (attr) {
                    el.setAttribute(attr, text);
                } else {
                    el.textContent = text;
                }
            });
        }

        applyModeSelectI18N(window.MODE_SELECT_INITIAL_LANG || "zh-TW");

        document.getElementById("btn-single").addEventListener("click", async () => {
            if (window.electronSerial)
                await window.electronAppMode.openMode("single");
            else
                window.location.href = "https://chingoliu.github.io/webkvm-quad/index1.html";
        });

        document.getElementById("btn-quad").addEventListener("click", async () => {
            if (window.electronSerial)
                await window.electronAppMode.openMode("quad");
            else
                window.location.href = "https://chingoliu.github.io/webkvm-quad/index4.html";
        });
    </script>
</body>
</html>
